{% extends "base.html" %}

{% block page_content %}
<div class="page-header">
    <h1>Hello, {{ name }}! Welcome to PRA3 Docker!</h1>
    <p>Your UofT email is {{ email }}</p>
</div>
<form method="post" action="{{ url_for('logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn btn-default">Logout</button>
</form>
<h2>Chatbot</h2>
<p>Tell me &ldquo;My name is Alice.&rdquo;, then ask &ldquo;What is my name?&rdquo;.</p>
<div id="conversation" class="well" role="log" aria-label="Conversation"
     aria-live="polite" aria-relevant="additions"></div>
<form id="chat-form" data-chat-url="{{ url_for('chat') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
        <label for="message">Message</label>
        <input type="text" id="message" name="message" class="form-control"
               required maxlength="{{ max_message_length }}" autocomplete="off"
               placeholder="My name is Alice.">
    </div>
    <button type="submit" class="btn btn-primary">Send</button>
</form>
{% endblock %}

{% block scripts %}
{{ super() }}
<script src="{{ url_for('static', filename='js/chat.js') }}" defer></script>
{% endblock %}
